# Todos os serviços enxergam a mesma pasta de mídia em /media (caminhos idênticos dentro dos contêineres).
x-linuxserver: &linuxserver
  restart: unless-stopped
  environment: &ls-env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: America/Sao_Paulo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-streamhub}
      POSTGRES_USER: ${DB_USER:-streamhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-streamhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-streamhub}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-streamhub}
      DB_USER: ${DB_USER:-streamhub}
      DB_PASSWORD: ${DB_PASSWORD:-streamhub}
      APP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin}
      APP_SECRET: ${APP_SECRET:-change-me-in-production}
      STORAGE_ALLOWED_ROOTS: /media
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      PROWLARR_URL: http://prowlarr:9696
      SONARR_URL: http://sonarr:8989
      RADARR_URL: http://radarr:7878
      QBIT_URL: http://qbittorrent:8080
      QBIT_USER: ${QBIT_USER:-admin}
      QBIT_PASSWORD: ${QBIT_PASSWORD:-adminadmin}
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_PUBLIC_URL: ${JELLYFIN_PUBLIC_URL:-http://localhost:8096}
      ARR_IMPORT_ON_COMPLETE: ${ARR_IMPORT_ON_COMPLETE:-false}
    volumes:
      - ${MEDIA_ROOT:-./media}:/media
      - ${DATA_ROOT:-./data}:/integrations:ro   # leitura automática das chaves de API (config.xml)
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
    depends_on: [backend]
    ports:
      - "5173:5173"

  prowlarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/prowlarr:latest
    volumes:
      - ${DATA_ROOT:-./data}/prowlarr:/config
    ports:
      - "9696:9696"

  sonarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:latest
    volumes:
      - ${DATA_ROOT:-./data}/sonarr:/config
      - ${MEDIA_ROOT:-./media}:/media
    ports:
      - "8989:8989"

  radarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:latest
    volumes:
      - ${DATA_ROOT:-./data}/radarr:/config
      - ${MEDIA_ROOT:-./media}:/media
    ports:
      - "7878:7878"

  qbittorrent:
    <<: *linuxserver
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      <<: *ls-env
      WEBUI_PORT: 8080
    volumes:
      - ${DATA_ROOT:-./data}/qbittorrent:/config
      - ${MEDIA_ROOT:-./media}:/media
    ports:
      - "8081:8080"
      - "6881:6881"
      - "6881:6881/udp"

  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${DATA_ROOT:-./data}/jellyfin/config:/config
      - ${DATA_ROOT:-./data}/jellyfin/cache:/cache
      - ${MEDIA_ROOT:-./media}:/media
    ports:
      - "8096:8096"

volumes:
  pgdata:
